services:
  postgres:
    image: postgres:18
    container_name: auth-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth_db

    ports:
      - "5432:5432"

    volumes:
     - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: